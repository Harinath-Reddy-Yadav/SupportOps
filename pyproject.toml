[project]
name = "supportops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Harinath Reddy Yadav", email = "harinathreddyyadav19@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "pyjwt>=2.15.1",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.6",
]


[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
